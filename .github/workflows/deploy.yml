name: Deploy

on:
  workflow_run:
    workflows: [ Tests ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Dokku
    runs-on: ubuntu-latest
    # Deploy only after CI passed on a push to main (not on PRs), or when triggered manually from main
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0

      - name: Deploy
        uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: ssh://dokku@78.47.43.140:22/shinygems
          branch: main
          ci_commit: ${{ env.COMMIT_SHA }}
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          ssh_host_key: ${{ secrets.DOKKU_SSH_HOST_KEY }}
